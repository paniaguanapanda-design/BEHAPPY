name: Deps temporal
on:
  push:
    branches: [mapa-ferreterias]
    paths: [".github/workflows/deps-temporal.yml"]
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npx expo install react-native-maps expo-location -- --ignore-scripts
      - run: |
          git config user.name "claude"
          git config user.email "noreply@anthropic.com"
          git rm -q ../.github/workflows/deps-temporal.yml
          git add package.json yarn.lock
          git commit -m "App: dependencias del mapa (react-native-maps, expo-location)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_017CFG3XkYdDnVj2tbJxuFWE"
          git push
