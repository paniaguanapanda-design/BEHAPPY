name: Frontend check
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend-check.yml"]
  pull_request:
    paths: ["frontend/**"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npx tsc --noEmit
