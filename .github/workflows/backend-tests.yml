name: Backend tests
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest "pytest-asyncio>=0.26"
      - run: pytest -q
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: behappy_test
          JWT_SECRET: test-secret
