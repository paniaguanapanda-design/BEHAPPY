name: tmp install expo-notifications
on:
  push:
    branches: [especialistas-pro]
    paths: [".github/workflows/tmp-install.yml"]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npx expo install expo-notifications expo-device
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q ../.github/workflows/tmp-install.yml
          git add package.json yarn.lock
          git commit -m "Instala expo-notifications"
          git push
